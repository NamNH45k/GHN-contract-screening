<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý người dùng - GHN Legal AI</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Additional styles for user management table */
    .users-table-container {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      margin-top: 20px;
    }
    .users-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    .users-table th, .users-table td {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
    }
    .users-table th {
      background: rgba(243, 244, 246, 0.5);
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
    .users-table tr:hover {
      background: rgba(255, 108, 10, 0.02);
    }
    .user-name-col {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar-sm {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 0.75rem;
    }
    
    .btn-invite {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
    }
    .btn-invite:hover {
      background: #e65c00;
    }

    .btn-delete {
      background: rgba(255, 85, 85, 0.1);
      color: var(--danger);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-delete:hover {
      background: rgba(255, 85, 85, 0.2);
    }

    /* Modal Styles */
    .invite-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 16, 26, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .invite-card {
      background: #ffffff;
      width: 100%;
      max-width: 450px;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }
    .invite-header {
      margin-bottom: 20px;
    }
    .invite-header h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--accent);
    }
    .invite-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }
    .btn-cancel {
      background: #f3f4f6;
      color: var(--text-primary);
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-cancel:hover {
      background: #e5e7eb;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Sidebar Navigation -->
    <aside>
      <div class="brand">
        <!-- Official GHN Logo -->
        <img src="https://cdn.hstatic.net/themes/200000472237/1001423864/14/logo.png?v=2850" alt="Giao Hàng Nhanh" style="height: 38px; width: auto; object-fit: contain;">
      </div>

      <nav class="sidebar-nav" style="flex: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 8px;">
        <a href="index.html" class="nav-item" style="padding: 10px 16px; color: var(--text-secondary); border-radius: 8px; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 10px;">
          <span>🏠</span> Trang chủ
        </a>
        <a href="users.html" class="nav-item active" id="nav-users" style="padding: 10px 16px; color: var(--accent); background: rgba(255, 108, 10, 0.1); border-radius: 8px; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 10px;">
          <span>👥</span> Quản lý người dùng
        </a>
      </nav>

      <div class="sidebar-footer">
        <!-- Logged in User Profile Section -->
        <div id="user-profile-section" class="user-profile-section" style="display: none;">
          <div class="user-info-row">
            <div id="user-avatar" class="user-avatar">?</div>
            <div class="user-details">
              <span id="user-display-name" class="user-name">Chưa đăng nhập</span>
              <span id="user-display-role" class="role-badge">Chưa xác định</span>
            </div>
            <button id="btn-logout" class="btn-logout" title="Đăng xuất">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M5 22C4.44772 22 4 21.5523 4 21V3C4 2.44772 4.44772 2 5 2H19C19.5523 2 20 2.44772 20 3V6H18V4H6V20H18V18H20V21C20 21.5523 19.5523 22 19 22H5ZM16 16V13H11V11H16V8L21 12L16 16Z"></path></svg>
            </button>
          </div>
        </div>

        <p>Phân hệ Legal AI Engine</p>
        <p>Phiên bản WebApp 1.0</p>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main>
      
      <!-- Top Header -->
      <header>
        <div class="header-title">
          <h1>Quản lý người dùng</h1>
        </div>
        
        <div class="stats-overview">
          <button id="btn-open-invite" class="btn-invite">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M11 11V5H13V11H19V13H13V19H11V13H5V11H11Z"></path></svg>
            Mời người dùng
          </button>
        </div>
      </header>

      <div style="padding: 24px; max-width: 1000px;">
        <p style="color: var(--text-secondary); margin-bottom: 20px;">Danh sách các tài khoản được phép truy cập và sử dụng hệ thống Legal AI.</p>
        
        <div class="users-table-container">
          <table class="users-table">
            <thead>
              <tr>
                <th>Email</th>
                <th>Vai trò</th>
                <th style="text-align: right;">Hành động</th>
              </tr>
            </thead>
            <tbody id="users-table-body">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

  </div>

  <!-- Invite User Modal -->
  <div id="invite-modal" class="invite-modal" style="display: none;">
    <div class="invite-card">
      <div class="invite-header">
        <h3>Mời người dùng mới</h3>
      </div>
      
      <div class="invite-body">
        <div class="form-group">
          <label for="invite-email">Email (tên miền @ghn.vn)</label>
          <input type="email" id="invite-email" placeholder="ví dụ: nhanvien@ghn.vn">
          <p id="invite-error" style="color: var(--danger); font-size: 0.75rem; margin-top: 6px; display: none; font-weight: 600;"></p>
        </div>
        <div class="form-group">
          <label for="invite-role">Vai trò</label>
          <select id="invite-role">
            <option value="user">User</option>
            <option value="admin">Admin</option>
            <option value="super_admin">Super Admin</option>
          </select>
        </div>
      </div>
      
      <div class="invite-footer">
        <button id="btn-invite-cancel" class="btn-cancel">Hủy</button>
        <button id="btn-invite-submit" class="btn-invite">Mời người dùng</button>
      </div>
    </div>
  </div>

  <!-- JavaScript and Database -->
  <script type="module" src="app.js"></script>
  <script type="module" src="users.js"></script>
</body>
</html>
